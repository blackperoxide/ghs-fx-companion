<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GHS FX Companion</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">GHS FX Companion</span>
    </div>
    <div class="topbar-actions">
      <button id="recordBtn" class="btn btn-record">
        <span class="rec-dot"></span>
        <span id="recordBtnLabel">Record &amp; Suggest</span>
      </button>
      <button id="scanBtn" class="btn btn-ghost" title="Re-read the local plugin scan cache">Refresh Scan</button>
    </div>
  </header>

  <div id="toasts" class="toasts"></div>

  <main class="layout">

    <section class="panel browser">
      <div class="panel-head">
        <h2>Plugin Library</h2>
        <span id="scanStatus" class="muted small"></span>
      </div>
      <input id="searchBox" class="search" type="text" placeholder="Search name, brand, category..." />
      <div id="pluginList" class="plugin-list"></div>
    </section>

    <section class="panel rack">
      <div class="panel-head">
        <h2>Rack</h2>
        <div class="preset-row">
          <select id="presetSelect" class="select">
            <option value="">Load preset...</option>
          </select>
          <button id="savePresetBtn" class="btn btn-ghost small">Save...</button>
          <button id="deletePresetBtn" class="btn btn-ghost small">Delete</button>
          <button id="importRecipeBtn" class="btn btn-ghost small">Import Recipe...</button>
        </div>
      </div>
      <div id="slotList" class="slot-list"></div>
    </section>

  </main>
</div>

<div id="modalRoot"></div>

<script src="app.js"></script>
</body>
</html>
